<html><head><base href="."><title>A.I. Medical Waiting Room</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
  }
}
</script>
<style>
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
}
canvas {
  width: 100%;
  height: 100%;
}
.stats {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 15px;
  background: rgba(233, 236, 239, 0.8);
  border-radius: 5px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
  color: #333;
  font-family: Arial, sans-serif;
}
.ambient-info {
  font-size: 14px;
  color: #666;
  font-style: italic;
  margin-top: 10px;
  padding: 10px;
  border-left: 3px solid #ccc;
}
</style>
</head><body>
<div class="stats">
  <h3>Waiting Room Statistics:</h3>
  <p>Current Patients: <span id="patientCount">4</span></p>
  <p>Average Wait Time: <span id="waitTime">23</span> minutes</p>
  <p>Next Patient: <span id="nextPatient">Johnson, Sarah</span></p>
  <p>Room Temperature: <span id="temperature">72&#xb0;F</span></p>
  <div class="ambient-info" id="ambientInfo"></div>
</div>

<script type="module">import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f4f8);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 10);
const renderer = new THREE.WebGLRenderer({
  antialias: true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.update();
let touchStartX = 0;
let touchStartY = 0;
let isTouching = false;
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.screenSpacePanning = false;
controls.maxPolarAngle = Math.PI / 2;
controls.minDistance = 5;
controls.maxDistance = 15;
renderer.domElement.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  isTouching = true;
}, false);
renderer.domElement.addEventListener('touchmove', e => {
  if (!isTouching) return;
  const touchX = e.touches[0].clientX;
  const touchY = e.touches[0].clientY;
  const deltaX = (touchX - touchStartX) * 0.01;
  const deltaY = (touchY - touchStartY) * 0.01;
  camera.position.x += deltaX;
  camera.position.y = Math.max(2, Math.min(8, camera.position.y - deltaY));
  touchStartX = touchX;
  touchStartY = touchY;
}, false);
renderer.domElement.addEventListener('touchend', () => {
  isTouching = false;
}, false);
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
directionalLight.position.set(5, 5, 5);
directionalLight.castShadow = true;
directionalLight.shadow.mapSize.width = 2048;
directionalLight.shadow.mapSize.height = 2048;
scene.add(directionalLight);
const pointLight1 = new THREE.PointLight(0xffffff, 0.5);
pointLight1.position.set(0, 8, 0);
scene.add(pointLight1);
const pointLight2 = new THREE.PointLight(0xffffff, 0.3);
pointLight2.position.set(-5, 8, -5);
scene.add(pointLight2);
const floorGeometry = new THREE.PlaneGeometry(20, 20, 50, 50);
const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xe6e6fa,
  roughness: 0.8,
  metalness: 0.2
});
const floor = new THREE.Mesh(floorGeometry, floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const wallMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.9,
  metalness: 0.1
});
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(20, 10), wallMaterial);
backWall.position.z = -10;
backWall.position.y = 5;
scene.add(backWall);
const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(20, 10), wallMaterial);
leftWall.position.x = -10;
leftWall.position.y = 5;
leftWall.rotation.y = Math.PI / 2;
scene.add(leftWall);
function createBaseboard(length, isHorizontal) {
  const baseboardGeometry = new THREE.BoxGeometry(isHorizontal ? length : 0.2, 0.3, isHorizontal ? 0.2 : length);
  const baseboardMaterial = new THREE.MeshStandardMaterial({
    color: 0x8b4513
  });
  return new THREE.Mesh(baseboardGeometry, baseboardMaterial);
}
const backBaseboard = createBaseboard(20, true);
backBaseboard.position.set(0, 0.15, -9.9);
scene.add(backBaseboard);
const leftBaseboard = createBaseboard(20, false);
leftBaseboard.position.set(-9.9, 0.15, 0);
scene.add(leftBaseboard);
function createChair() {
  const chairGroup = new THREE.Group();
  const seatGeometry = new THREE.BoxGeometry(1, 0.1, 1);
  const seatMaterial = new THREE.MeshStandardMaterial({
    color: 0x4169e1,
    roughness: 0.7,
    metalness: 0.3
  });
  const seat = new THREE.Mesh(seatGeometry, seatMaterial);
  seat.position.y = 0.55;
  seat.castShadow = true;
  const backGeometry = new THREE.BoxGeometry(1, 1.2, 0.1);
  const back = new THREE.Mesh(backGeometry, seatMaterial);
  back.position.y = 1.15;
  back.position.z = -0.45;
  back.castShadow = true;
  const legGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.5);
  const legMaterial = new THREE.MeshStandardMaterial({
    color: 0x808080
  });
  const positions = [[-0.4, 0.25, 0.4], [0.4, 0.25, 0.4], [-0.4, 0.25, -0.4], [0.4, 0.25, -0.4]];
  positions.forEach(pos => {
    const leg = new THREE.Mesh(legGeometry, legMaterial);
    leg.position.set(...pos);
    leg.castShadow = true;
    chairGroup.add(leg);
  });
  chairGroup.add(seat);
  chairGroup.add(back);
  return chairGroup;
}
const chairs = [];
for (let i = 0; i < 4; i++) {
  const chair = createChair();
  chair.position.set(-3 + i * 2, 0, -8);
  scene.add(chair);
  chairs.push(chair);
}
function createReceptionDesk() {
  const deskGroup = new THREE.Group();
  const deskGeometry = new THREE.BoxGeometry(4, 1.2, 1);
  const deskMaterial = new THREE.MeshStandardMaterial({
    color: 0xa0522d,
    roughness: 0.6,
    metalness: 0.2
  });
  const desk = new THREE.Mesh(deskGeometry, deskMaterial);
  desk.castShadow = true;
  const computerGeometry = new THREE.BoxGeometry(0.8, 0.5, 0.5);
  const computerMaterial = new THREE.MeshStandardMaterial({
    color: 0x333333
  });
  const computer = new THREE.Mesh(computerGeometry, computerMaterial);
  computer.position.set(-1, 0.85, 0);
  const monitorGeometry = new THREE.BoxGeometry(0.8, 0.6, 0.1);
  const monitor = new THREE.Mesh(monitorGeometry, computerMaterial);
  monitor.position.set(-1, 1.5, 0);
  deskGroup.add(desk);
  deskGroup.add(computer);
  deskGroup.add(monitor);
  return deskGroup;
}
const receptionDesk = createReceptionDesk();
receptionDesk.position.set(-8, 0.6, -8);
scene.add(receptionDesk);
function createPlant() {
  const plantGroup = new THREE.Group();
  const potGeometry = new THREE.CylinderGeometry(0.3, 0.4, 0.6, 16);
  const potMaterial = new THREE.MeshStandardMaterial({
    color: 0x8b4513,
    roughness: 0.8
  });
  const pot = new THREE.Mesh(potGeometry, potMaterial);
  pot.castShadow = true;
  for (let i = 0; i < 5; i++) {
    const leavesGeometry = new THREE.SphereGeometry(0.3, 8, 8);
    const leavesMaterial = new THREE.MeshStandardMaterial({
      color: 0x228b22,
      roughness: 1.0
    });
    const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
    leaves.position.y = 0.6 + Math.random() * 0.3;
    leaves.position.x = (Math.random() - 0.5) * 0.3;
    leaves.position.z = (Math.random() - 0.5) * 0.3;
    leaves.castShadow = true;
    plantGroup.add(leaves);
  }
  plantGroup.add(pot);
  return plantGroup;
}
const plant = createPlant();
plant.position.set(8, 0, -8);
scene.add(plant);
function createClock() {
  const clockGroup = new THREE.Group();
  const faceGeometry = new THREE.CircleGeometry(0.5, 32);
  const faceMaterial = new THREE.MeshStandardMaterial({
    color: 0xffffff
  });
  const face = new THREE.Mesh(faceGeometry, faceMaterial);
  const frameGeometry = new THREE.RingGeometry(0.5, 0.55, 32);
  const frameMaterial = new THREE.MeshStandardMaterial({
    color: 0x000000
  });
  const frame = new THREE.Mesh(frameGeometry, frameMaterial);
  for (let i = 0; i < 12; i++) {
    const markGeometry = new THREE.BoxGeometry(0.05, 0.15, 0.01);
    const mark = new THREE.Mesh(markGeometry, frameMaterial);
    mark.position.y = 0.35;
    mark.position.z = 0.01;
    mark.rotation.z = i * Math.PI / 6;
    clockGroup.add(mark);
  }
  const hourHandGeometry = new THREE.BoxGeometry(0.05, 0.25, 0.01);
  const minuteHandGeometry = new THREE.BoxGeometry(0.03, 0.35, 0.01);
  const secondHandGeometry = new THREE.BoxGeometry(0.02, 0.4, 0.01);
  const handMaterial = new THREE.MeshStandardMaterial({
    color: 0x000000
  });
  const hourHand = new THREE.Mesh(hourHandGeometry, handMaterial);
  const minuteHand = new THREE.Mesh(minuteHandGeometry, handMaterial);
  const secondHand = new THREE.Mesh(secondHandGeometry, new THREE.MeshStandardMaterial({
    color: 0xff0000
  }));
  hourHand.position.z = 0.02;
  minuteHand.position.z = 0.03;
  secondHand.position.z = 0.04;
  clockGroup.add(face);
  clockGroup.add(frame);
  clockGroup.add(hourHand);
  clockGroup.add(minuteHand);
  clockGroup.add(secondHand);
  clockGroup.userData.hands = {
    hour: hourHand,
    minute: minuteHand,
    second: secondHand
  };
  return clockGroup;
}
const clock = createClock();
clock.position.set(0, 7, -9.9);
scene.add(clock);
const audioListener = new THREE.AudioListener();
camera.add(audioListener);
const ambientSound = new THREE.Audio(audioListener);
const audioLoader = new THREE.AudioLoader();
audioLoader.load('https://cdn.example.com/ambient-office.mp3', function (buffer) {
  ambientSound.setBuffer(buffer);
  ambientSound.setLoop(true);
  ambientSound.setVolume(0.2);
  ambientSound.play();
});
const windowGeometry = new THREE.PlaneGeometry(4, 3);
const windowTexture = new THREE.TextureLoader().load('https://cdn.example.com/window-view.jpg');
const windowMaterial = new THREE.MeshStandardMaterial({
  map: windowTexture,
  emissive: 0xffffff,
  emissiveIntensity: 0.2
});
const window = new THREE.Mesh(windowGeometry, windowMaterial);
window.position.set(8, 4, -9.9);
scene.add(window);
const magazineRack = new THREE.Group();
const rackGeometry = new THREE.BoxGeometry(1.5, 2, 0.3);
const rackMaterial = new THREE.MeshStandardMaterial({
  color: 0x8b4513
});
const rack = new THREE.Mesh(rackGeometry, rackMaterial);
for (let i = 0; i < 5; i++) {
  const magazineGeometry = new THREE.BoxGeometry(0.8, 0.3, 0.05);
  const magazineMaterial = new THREE.MeshStandardMaterial({
    color: Math.random() * 0xffffff
  });
  const magazine = new THREE.Mesh(magazineGeometry, magazineMaterial);
  magazine.position.y = -0.8 + i * 0.3;
  magazine.position.z = 0.1;
  magazineRack.add(magazine);
}
magazineRack.add(rack);
magazineRack.position.set(-9, 2, -8);
scene.add(magazineRack);
const waterDispenser = new THREE.Group();
const tankGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.8);
const tankMaterial = new THREE.MeshStandardMaterial({
  color: 0xadd8e6,
  transparent: true,
  opacity: 0.6
});
const tank = new THREE.Mesh(tankGeometry, tankMaterial);
tank.position.y = 1;
const baseGeometry = new THREE.BoxGeometry(0.8, 1, 0.8);
const baseMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff
});
const base = new THREE.Mesh(baseGeometry, baseMaterial);
waterDispenser.add(tank);
waterDispenser.add(base);
waterDispenser.position.set(9, 0, -8);
scene.add(waterDispenser);
function animate() {
  requestAnimationFrame(animate);
  const now = new Date();
  const hours = now.getHours() % 12;
  const minutes = now.getMinutes();
  const seconds = now.getSeconds();
  clock.userData.hands.hour.rotation.z = -((hours + minutes / 60) * Math.PI / 6);
  clock.userData.hands.minute.rotation.z = -(minutes * Math.PI / 30);
  clock.userData.hands.second.rotation.z = -(seconds * Math.PI / 30);
  plant.rotation.y += 0.001;
  controls.update();
  renderer.render(scene, camera);
}
const windowResizeHandler = () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
};
animate();
window.addEventListener('resize', windowResizeHandler);
function updateStats() {
  const patientCount = document.getElementById('patientCount');
  const waitTime = document.getElementById('waitTime');
  const nextPatient = document.getElementById('nextPatient');
  const temperature = document.getElementById('temperature');
  const patients = ['Johnson, Sarah', 'Smith, Michael', 'Williams, Emma', 'Brown, David', 'Miller, Lisa', 'Davis, John', 'Wilson, Emily'];
  patientCount.textContent = Math.floor(Math.random() * 3) + 3;
  waitTime.textContent = Math.floor(Math.random() * 20) + 15;
  nextPatient.textContent = patients[Math.floor(Math.random() * patients.length)];
  temperature.textContent = `${Math.floor(Math.random() * 3) + 71}°F`;
}
function updateAmbientInfo() {
  const ambientInfo = document.getElementById('ambientInfo');
  const ambientEvents = ['Pages rustling as someone reads a magazine...', 'Gentle hum of the air conditioning...', 'Quiet conversation at the reception desk...', 'Phone ringing in the distance...', 'Sound of typing from the receptionist...', 'Door opening as a patient enters...', 'Water dispenser bubbling softly...', 'Muffled footsteps from the hallway...', 'Pen scratching on clipboard...', 'Subtle cough from the corner...', 'Children\'s voices from outside...', 'Magazine pages being turned...'];
  ambientInfo.textContent = ambientEvents[Math.floor(Math.random() * ambientEvents.length)];
}
setInterval(updateStats, 30000);
setInterval(updateAmbientInfo, 8000);
updateStats();
updateAmbientInfo();</script>
