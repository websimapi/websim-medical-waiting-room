<html><head><base href="." /><title>A.I. Medical Waiting Room</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
  }
}
</script>
<style>
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
}
canvas {
  width: 100%;
  height: 100%;
}
.stats {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 15px;
  background: rgba(233, 236, 239, 0.8);
  border-radius: 5px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
  color: #333;
  font-family: Arial, sans-serif;
}
.ambient-info {
  font-size: 14px;
  color: #666;
  font-style: italic;
  margin-top: 10px;
  padding: 10px;
  border-left: 3px solid #ccc;
}
</style>
</head><body>
<div class="stats">
  <h3>Waiting Room Statistics:</h3>
  <p>Current Patients: <span id="patientCount">4</span></p>
  <p>Average Wait Time: <span id="waitTime">23</span> minutes</p>
  <p>Next Patient: <span id="nextPatient">Johnson, Sarah</span></p>
  <p>Room Temperature: <span id="temperature">72°F</span></p>
  <div class="ambient-info" id="ambientInfo"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Scene setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f4f8);

// Camera setup
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 10);

// Renderer setup
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.update();

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
directionalLight.position.set(5, 5, 5);
directionalLight.castShadow = true;
scene.add(directionalLight);

// Floor
const floorGeometry = new THREE.PlaneGeometry(20, 20);
const floorMaterial = new THREE.MeshStandardMaterial({ color: 0xe6e6fa });
const floor = new THREE.Mesh(floorGeometry, floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Walls
const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff });

const backWall = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 10),
  wallMaterial
);
backWall.position.z = -10;
backWall.position.y = 5;
scene.add(backWall);

const leftWall = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 10),
  wallMaterial
);
leftWall.position.x = -10;
leftWall.position.y = 5;
leftWall.rotation.y = Math.PI / 2;
scene.add(leftWall);

// Chairs
function createChair() {
  const chairGroup = new THREE.Group();
  
  const seatGeometry = new THREE.BoxGeometry(1, 0.1, 1);
  const seatMaterial = new THREE.MeshStandardMaterial({ color: 0x4169e1 });
  const seat = new THREE.Mesh(seatGeometry, seatMaterial);
  seat.position.y = 0.5;
  
  const backGeometry = new THREE.BoxGeometry(1, 1.2, 0.1);
  const back = new THREE.Mesh(backGeometry, seatMaterial);
  back.position.y = 1.1;
  back.position.z = -0.45;
  
  chairGroup.add(seat);
  chairGroup.add(back);
  
  return chairGroup;
}

// Add chairs
const chairs = [];
for(let i = 0; i < 4; i++) {
  const chair = createChair();
  chair.position.set(-3 + (i * 2), 0, -8);
  scene.add(chair);
  chairs.push(chair);
}

// Reception desk
const deskGeometry = new THREE.BoxGeometry(4, 1.2, 1);
const deskMaterial = new THREE.MeshStandardMaterial({ color: 0xa0522d });
const desk = new THREE.Mesh(deskGeometry, deskMaterial);
desk.position.set(-8, 0.6, -8);
scene.add(desk);

// Plant
function createPlant() {
  const plantGroup = new THREE.Group();
  
  const potGeometry = new THREE.CylinderGeometry(0.3, 0.4, 0.6);
  const potMaterial = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
  const pot = new THREE.Mesh(potGeometry, potMaterial);
  
  const leavesGeometry = new THREE.SphereGeometry(0.6, 8, 8);
  const leavesMaterial = new THREE.MeshStandardMaterial({ color: 0x228b22 });
  const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
  leaves.position.y = 0.6;
  
  plantGroup.add(pot);
  plantGroup.add(leaves);
  
  return plantGroup;
}

const plant = createPlant();
plant.position.set(8, 0, -8);
scene.add(plant);

// Animation
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

// Window resize handler
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Stats updates
function updateStats() {
  const patientCount = document.getElementById('patientCount');
  const waitTime = document.getElementById('waitTime');
  const nextPatient = document.getElementById('nextPatient');
  const temperature = document.getElementById('temperature');
  
  const patients = ['Johnson, Sarah', 'Smith, Michael', 'Williams, Emma', 'Brown, David', 'Miller, Lisa', 'Davis, John', 'Wilson, Emily'];
  
  patientCount.textContent = Math.floor(Math.random() * 3) + 3;
  waitTime.textContent = Math.floor(Math.random() * 20) + 15;
  nextPatient.textContent = patients[Math.floor(Math.random() * patients.length)];
  temperature.textContent = `${Math.floor(Math.random() * 3) + 71}°F`;
}

function updateAmbientInfo() {
  const ambientInfo = document.getElementById('ambientInfo');
  const ambientEvents = [
    'Pages rustling as someone reads a magazine...',
    'Gentle hum of the air conditioning...',
    'Quiet conversation at the reception desk...',
    'Phone ringing in the distance...',
    'Sound of typing from the receptionist...',
    'Door opening as a patient enters...',
    'Water dispenser bubbling softly...',
    'Muffled footsteps from the hallway...',
    'Pen scratching on clipboard...',
    'Subtle cough from the corner...',
    'Children\'s voices from outside...',
    'Magazine pages being turned...'
  ];
  
  ambientInfo.textContent = ambientEvents[Math.floor(Math.random() * ambientEvents.length)];
}

setInterval(updateStats, 30000);
setInterval(updateAmbientInfo, 8000);

updateStats();
updateAmbientInfo();
animate();
</script>

</body></html>
