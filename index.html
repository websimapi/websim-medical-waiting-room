function createWarningSign() {
  const signGroup = new THREE.Group();
  const signGeometry = new THREE.PlaneGeometry(2, 1.2);
  const signMaterial = new THREE.MeshStandardMaterial({
    color: 0xfff9c4,
    roughness: 0.9,
    metalness: 0.1
  });
  const sign = new THREE.Mesh(signGeometry, signMaterial);
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 256;
  const context = canvas.getContext('2d');
  context.fillStyle = '#000000';
  context.font = 'bold 40px Arial';
  context.textAlign = 'center';
  context.fillText('Please sanitize hands', 256, 80);
  context.fillText('before check-in', 256, 130);
  context.fillText('Masks required', 256, 180);
  context.fillText('beyond this point', 256, 230);
  const texture = new THREE.CanvasTexture(canvas);
  const textGeometry = new THREE.PlaneGeometry(1.95, 1.15);
  const textMaterial = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true
  });
  const text = new THREE.Mesh(textGeometry, textMaterial);
  text.position.z = 0.01;
  signGroup.add(sign);
  signGroup.add(text);
  return signGroup;
}
function createEnhancedGlassMaterial() {
  return new THREE.MeshPhysicalMaterial({
    transparent: true,
    opacity: 0.15,
    roughness: 0.01,
    transmission: 0.99,
    thickness: 0.02,
    clearcoat: 1.0,
    clearcoatRoughness: 0.05,
    ior: 1.52,
    envMapIntensity: 2.0,
    reflectivity: 1.0,
    metalness: 0.0,
    attenuationColor: new THREE.Color(0xffffff),
    attenuationDistance: 5.0
  });
}
function createGlassWall(width, height) {

  return glass;
}
function createGlassDoor() {
  const doorGroup = new THREE.Group();
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(2, 4, 50, 50), createEnhancedGlassMaterial());
  const frameTop = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.1, 0.08), new THREE.MeshStandardMaterial({
    color: 0x505050,
    roughness: 0.7,
    metalness: 0.3
  }));
  frameTop.position.y = 2.05;
  frameTop.position.z = -0.04;
  const frameSides = [];
  for (let i = 0; i < 2; i++) {
    const side = new THREE.Mesh(new THREE.BoxGeometry(0.1, 4, 0.08), new THREE.MeshStandardMaterial({
      color: 0x505050,
      roughness: 0.7,
      metalness: 0.3
    }));
    side.position.x = i === 0 ? -1.05 : 1.05;
    side.position.z = -0.04;
    frameSides.push(side);
  }
  const handleGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.4);
  const handleMaterial = new THREE.MeshStandardMaterial({
    color: 0xc0c0c0
  });
  const handle = new THREE.Mesh(handleGeometry, handleMaterial);
  handle.rotation.x = Math.PI / 2;
  handle.position.set(0.8, 0, 0.1);
  doorGroup.add(glass);
  doorGroup.add(frameTop);
  frameSides.forEach(side => doorGroup.add(side));
  doorGroup.add(handle);
  return doorGroup;
}

  camera.position.x += deltaX;
