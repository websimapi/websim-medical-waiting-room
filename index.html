<html><head><base href="." /><title>A.I. Medical Waiting Room</title><style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background-color: #f0f4f8;
}

.waiting-room {
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 20px rgba(0,0,0,0.1);
}

.scene {
  position: relative;
  width: 100%;
  height: 400px;
  overflow: hidden;
  border-radius: 8px;
  background: #fff;
  margin-bottom: 20px;
}

.patient {
  position: absolute;
  animation: patientMove 15s infinite;
}

.nurse {
  position: absolute;
  animation: nurseWalk 20s infinite;
}

.clock {
  position: absolute;
  right: 20px;
  top: 20px;
  font-size: 24px;
  font-family: monospace;
}

.magazine-rack {
  position: absolute;
  bottom: 20px;
  left: 20px;
  width: 100px;
  height: 150px;
}

@keyframes patientMove {
  0% { left: 10%; top: 50%; }
  25% { left: 30%; top: 30%; }
  50% { left: 50%; top: 60%; }
  75% { left: 70%; top: 40%; }
  100% { left: 10%; top: 50%; }
}

@keyframes nurseWalk {
  0% { right: 0; top: 20%; }
  50% { right: 70%; top: 20%; }
  100% { right: 0; top: 20%; }
}

.stats {
  padding: 10px;
  background: #e9ecef;
  border-radius: 5px;
  margin-top: 10px;
}

</style></head><body>
<div class="waiting-room">
  <h1>Medical Office Waiting Room Simulation</h1>
  <div class="scene">
    <div class="clock" id="clock">12:00</div>
    
    <svg class="patient" width="50" height="50">
      <circle cx="25" cy="25" r="20" fill="#FFB6C1"/>
      <circle cx="20" cy="20" r="5" fill="#333"/>
      <circle cx="30" cy="20" r="5" fill="#333"/>
      <path d="M 15 30 Q 25 35 35 30" stroke="#333" fill="none"/>
    </svg>

    <svg class="nurse" width="50" height="50">
      <rect x="10" y="10" width="30" height="35" fill="#white"/>
      <circle cx="25" cy="20" r="15" fill="#87CEEB"/>
      <circle cx="20" cy="15" r="3" fill="#333"/>
      <circle cx="30" cy="15" r="3" fill="#333"/>
      <path d="M 15 25 Q 25 30 35 25" stroke="#333" fill="none"/>
    </svg>

    <svg class="magazine-rack" viewBox="0 0 100 150">
      <rect x="10" y="10" width="80" height="130" fill="#8B4513"/>
      <rect x="15" y="20" width="70" height="20" fill="#DEB887"/>
      <rect x="15" y="50" width="70" height="20" fill="#DEB887"/>
      <rect x="15" y="80" width="70" height="20" fill="#DEB887"/>
    </svg>
  </div>

  <div class="stats">
    <h3>Waiting Room Statistics:</h3>
    <p>Current Patients: <span id="patientCount">4</span></p>
    <p>Average Wait Time: <span id="waitTime">23</span> minutes</p>
    <p>Next Patient: <span id="nextPatient">Johnson, Sarah</span></p>
  </div>
</div>

<script>
function updateClock() {
  const clockElement = document.getElementById('clock');
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  clockElement.textContent = `${hours}:${minutes}`;
}

function updateStats() {
  const patientCount = document.getElementById('patientCount');
  const waitTime = document.getElementById('waitTime');
  
  // Randomly fluctuate statistics
  patientCount.textContent = Math.floor(Math.random() * 3) + 3;
  waitTime.textContent = Math.floor(Math.random() * 20) + 15;
}

// Update clock every second
setInterval(updateClock, 1000);

// Update stats every 30 seconds
setInterval(updateStats, 30000);

// Initial updates
updateClock();
updateStats();
</script>

</body></html>
